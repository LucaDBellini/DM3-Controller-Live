<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">DM3 Controller V7.2.2 — Verkabelungsschema (Single-Encoder)</text>

  <!-- Battery -->
  <rect x="40" y="60" width="150" height="70" rx="6" fill="#fff3cd" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="115" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Li-Ion Akku</text>
  <text x="115" y="106" text-anchor="middle" font-size="12" fill="#333">3,7V / 2000mAh</text>
  <text x="52" y="72" font-size="12" fill="#333">+</text>
  <text x="52" y="122" font-size="12" fill="#333">−</text>

  <!-- + wire to switch -->
  <line x1="190" y1="75" x2="230" y2="75" stroke="#111" stroke-width="2"/>
  <!-- switch symbol (SPST) -->
  <circle cx="232" cy="75" r="3" fill="#111"/>
  <line x1="235" y1="73" x2="270" y2="58" stroke="#111" stroke-width="2"/>
  <circle cx="273" cy="75" r="3" fill="#111"/>
  <text x="240" y="48" font-size="12" fill="#b30000" font-weight="bold">EIN/AUS-Schalter (SPST)</text>
  <line x1="276" y1="75" x2="420" y2="75" stroke="#111" stroke-width="2"/>
  <text x="330" y="68" text-anchor="middle" font-size="12" fill="#333">BATT+</text>

  <!-- - wire direct to GND -->
  <line x1="115" y1="130" x2="115" y2="150" stroke="#111" stroke-width="2"/>
  <line x1="115" y1="150" x2="420" y2="150" stroke="#111" stroke-width="2"/>
  <text x="330" y="143" text-anchor="middle" font-size="12" fill="#333">GND</text>

  <!-- Board -->
  <rect x="420" y="40" width="260" height="560" rx="10" fill="#e8f0fe" stroke="#1a4fa0" stroke-width="2"/>
  <text x="550" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a6b">Heltec LoRa32 V4.2</text>
  <text x="550" y="95" text-anchor="middle" font-size="13" fill="#1a3a6b">(ESP32-S3, LoRa ungenutzt)</text>

  <!-- board connector pins for battery -->
  <circle cx="420" cy="75" r="3" fill="#111"/>
  <circle cx="420" cy="150" r="3" fill="#111"/>

  <!-- note: VBAT ADC internal -->
  <rect x="440" y="475" width="220" height="95" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
  <text x="550" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">GPIO1 (VBAT-ADC)</text>
  <text x="550" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">GPIO37 (ADC-Freigabe, HIGH)</text>
  <text x="550" y="530" text-anchor="middle" font-size="11" fill="#555">Board-interne Akku-Messschaltung</text>
  <text x="550" y="545" text-anchor="middle" font-size="11" fill="#555">(fest verdrahtet). Keine externe</text>
  <text x="550" y="560" text-anchor="middle" font-size="11" fill="#555">Verkabelung nötig.</text>

  <!-- Display group -->
  <rect x="760" y="90" width="190" height="150" rx="6" fill="#e6f4ea" stroke="#1e7a34" stroke-width="1.5"/>
  <text x="855" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e7a34">SSD1306 OLED</text>
  <text x="855" y="132" text-anchor="middle" font-size="12" fill="#1e7a34">128×64, I2C</text>
  <text x="855" y="149" text-anchor="middle" font-size="12" fill="#1e7a34">(Onboard, fest verlötet)</text>

  <g font-size="12" fill="#333">
    <line x1="680" y1="120" x2="760" y2="120" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="690" y="115">GPIO17 · SDA</text>

    <line x1="680" y1="150" x2="760" y2="150" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="690" y="145">GPIO18 · SCL</text>

    <line x1="680" y1="180" x2="760" y2="180" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="690" y="175">GPIO21 · RST</text>

    <line x1="680" y1="210" x2="760" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="686" y="205">GPIO36 · Vext (Display-Power)</text>
  </g>

  <!-- Encoder group -->
  <rect x="760" y="280" width="190" height="120" rx="6" fill="#fdeeee" stroke="#a52a2a" stroke-width="1.5"/>
  <text x="855" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2020">Inkremental-Encoder</text>
  <text x="855" y="325" text-anchor="middle" font-size="12" fill="#8a2020">mit Taster</text>

  <g font-size="12" fill="#333">
    <line x1="680" y1="310" x2="760" y2="310" stroke="#111" stroke-width="1.5"/>
    <text x="694" y="305">GPIO16 · A</text>

    <line x1="680" y1="340" x2="760" y2="340" stroke="#111" stroke-width="1.5"/>
    <text x="694" y="335">GPIO15 · B</text>

    <line x1="680" y1="370" x2="760" y2="370" stroke="#111" stroke-width="1.5"/>
    <text x="678" y="365">GPIO0 · Taster (Menü/Settings)</text>
  </g>

  <!-- Status LED -->
  <rect x="760" y="425" width="190" height="70" rx="6" fill="#fff8e1" stroke="#a58200" stroke-width="1.5"/>
  <text x="855" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a6100">Status-LED (weiß)</text>
  <text x="855" y="470" text-anchor="middle" font-size="11" fill="#7a6100">(Onboard, fest verlötet)</text>

  <g font-size="12" fill="#333">
    <line x1="680" y1="455" x2="760" y2="455" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="690" y="450">GPIO35</text>
  </g>

  <!-- legend -->
  <line x1="380" y1="618" x2="415" y2="618" stroke="#111" stroke-width="2"/>
  <text x="420" y="622" font-size="11" fill="#555">extern zu verkabeln</text>
  <line x1="560" y1="618" x2="595" y2="618" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="622" font-size="11" fill="#555">onboard, fest verlötet</text>

  <text x="500" y="648" text-anchor="middle" font-size="11" fill="#777">Vereinfachtes Verkabelungsschema (kein EE-Schaltplan). Pinbelegung laut README-Pintabelle / offiziellem Heltec-Pinmap.</text>
</svg>
